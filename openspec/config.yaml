# openspec/config.yaml
schema: spec-driven

context: |
  Project: Grow Creative Education Studio (repo "proyecto-costura", folder "Proyecto-Kiro").
  Monorepo with two independent apps (no root package.json):
    - backend/ (costura-api): NestJS 10 + TypeScript 5.3 (strict) + Prisma 5 + PostgreSQL, JWT auth (passport-jwt). Feature modules under src/ (auth, users, courses, lessons, purchases, lesson-progress, notifications, favorites, certificates, lesson-comments, attachments, mail, prisma).
    - costura-app/: React 19 + Vite 8 + Tailwind 4 + react-router-dom 7. Structure: pages/, components/, context/, hooks/, services/. Context API for global state. JSX (not TSX). Uses fetch helpers in services/api.js (no axios).
  Testing: backend has Jest + Supertest e2e specs (test/*.spec.ts, `npm test`); costura-app has Vitest (`npm test`). Lint available in both apps; typecheck (tsc --noEmit) in backend. No CI workflows yet.
  Style: conventional commits (feat/fix/style/chore/refactor/test) seen in git history; project docs written in Spanish; default branch is "dev".
  Artifact language: English (neutral).

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns (feature modules in backend, pages/components/context/hooks/services in frontend)
    tdd: false           # No Strict TDD runner configured; tests exist but are written after implementation
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas